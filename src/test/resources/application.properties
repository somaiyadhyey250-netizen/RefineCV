spring.application.name=resume-analyzer

# Keep upload limits in one place; multipart request allowance includes form overhead.
refinecv.upload.max-file-size=5MB
refinecv.upload.max-request-size=6MB
spring.servlet.multipart.max-file-size=${refinecv.upload.max-file-size}
spring.servlet.multipart.max-request-size=${refinecv.upload.max-request-size}

# Bound parser/OCR work and the content sent to Gemini.
refinecv.pdf.max-pages=20
refinecv.pdf.max-extracted-text-characters=50000
refinecv.pdf.ocr.max-page-width-points=3600
refinecv.pdf.ocr.max-page-height-points=3600
refinecv.pdf.ocr.max-rendered-pixels=8000000
refinecv.ocr.tessdata-path=tessdata

# Bounded analysis workers: 2 active threads plus at most 8 queued analyses.
refinecv.analysis.executor.core-pool-size=2
refinecv.analysis.executor.max-pool-size=4
refinecv.analysis.executor.queue-capacity=8
refinecv.analysis.executor.shutdown-wait-seconds=10
refinecv.analysis.timeout=180s
refinecv.analysis.sse-timeout-grace=15s
spring.mvc.async.request-timeout=180000

# Per-client in-memory abuse control for /analyze (single application instance).
refinecv.analysis.rate-limit.max-requests=10
refinecv.analysis.rate-limit.window=15m
refinecv.analysis.rate-limit.max-tracked-clients=10000

# Bound and validate the structured result returned by Gemini.
refinecv.gemini.max-response-characters=20000
refinecv.gemini.api-key=
refinecv.gemini.model=gemini-3.6-flash

# Groq provider configuration (isolated in tests)
refinecv.groq.api-key=
refinecv.groq.model=openai/gpt-oss-20b
refinecv.groq.base-url=https://api.groq.com/openai/v1
refinecv.groq.timeout=60s
refinecv.groq.max-response-characters=20000
